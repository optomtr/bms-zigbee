<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BMS · Zigbee2MQTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#409CFF}a:hover{color:#6BB2FF}
.root{--accent:#409CFF;--accent-fill:#0071E3;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Helvetica Neue",Arial,sans-serif;--round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,Inter,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
.root.dark{color-scheme:dark;--bg:#000;--grp:#1C1C1E;--grp2:#2C2C2E;--label:#FFFFFF;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.32);--sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.36);--fill2:rgba(118,118,128,.24);--green:#30D158;--orange:#FF9F0A;--red:#FF6961;--yellow:#FFD60A;--gray:#8E8E93;--indigo:#5E5CE6;--teal:#40C8E0;--tile:#1C1C1E;--thumb:#636366;--sheet:#1C1C1E;--scrim:rgba(0,0,0,.6)}
.root.light{color-scheme:light;--bg:#F2F2F7;--grp:#FFFFFF;--grp2:#F2F2F7;--label:#000000;--label2:#6E6E73;--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.29);--fill:rgba(120,120,128,.2);--fill2:rgba(118,118,128,.12);--green:#34C759;--orange:#C93400;--red:#D70015;--yellow:#FFCC00;--gray:#8E8E93;--indigo:#5856D6;--teal:#30B0C7;--tile:#E3E3E8;--thumb:#FFFFFF;--sheet:#F2F2F7;--scrim:rgba(0,0,0,.35)}
.root *,.root *::before,.root *::after{box-sizing:border-box}
.root button,.root input,.root select{font-family:inherit}
.root button{-webkit-tap-highlight-color:transparent}
.root :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--fill2);color:var(--accent);font-size:15px;line-height:20px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .45s cubic-bezier(.25,1.6,.4,1),background-color .2s,opacity .2s,color .2s,box-shadow .4s}
.btn:hover{background:var(--fill)}
.btn:active{transform:scale(.93);transition-duration:.12s}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn-fill{background:var(--accent-fill);color:#fff}
.btn-fill:hover{background:var(--accent-fill);filter:brightness(1.12)}
.btn-red{color:var(--red)}
.btn-red.armed{background:var(--red);color:#fff}
.btn svg{flex:none}
.btn::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.18);opacity:0;transition:opacity .35s;pointer-events:none}
.btn:active::after{opacity:1;transition:0s}

/* fired: glow ring + specular sweep */
.fired{animation:ring .7s cubic-bezier(.2,.7,.3,1)}
.fired::before{content:"";position:absolute;top:0;bottom:0;left:-70%;width:55%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sweep .65s ease-out forwards;pointer-events:none}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 16px color-mix(in srgb,var(--accent) 0%,transparent)}}
@keyframes sweep{to{left:125%}}

/* iOS switch */
.sw{position:relative;flex:none;width:51px;height:31px;border:0;padding:0;border-radius:999px;background:var(--fill);cursor:pointer;transition:background-color .25s,box-shadow .5s}
.sw::before{content:"";position:absolute;inset:-7px -2px}
.sw .knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .4s cubic-bezier(.3,1.5,.45,1),width .2s}
.sw.on{background:var(--green)}
.sw.on .knob{transform:translateX(20px)}
.sw:active .knob{width:33px}
.sw.on:active .knob{transform:translateX(14px)}
.sw:disabled{opacity:.4;cursor:default}
.sw.fired{animation:swring .6s ease-out}
@keyframes swring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}100%{box-shadow:0 0 0 12px color-mix(in srgb,var(--green) 0%,transparent)}}

/* grouped lists */
.group{background:var(--grp);border-radius:12px;overflow:hidden}
.ghead{margin:0 0 6px 16px;font-size:13px;line-height:18px;font-weight:400;text-transform:uppercase;color:var(--label2);letter-spacing:0}
.gfoot{margin:6px 16px 0;font-size:13px;line-height:18px;color:var(--label2)}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px}
.row:not(:first-child)::before{content:"";position:absolute;top:0;left:58px;right:0;height:1px;transform:scaleY(.5);transform-origin:top;background:var(--sep)}
.row.plain:not(:first-child)::before{left:16px}
.icotile{flex:none;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;transition:background-color .3s,transform .45s cubic-bezier(.3,1.6,.45,1)}
.ti-green{background:#28A745}.ti-orange{background:#E07800}.ti-gray{background:#8E8E93}.ti-blue{background:#0071E3}.ti-indigo{background:#5E5CE6}.ti-teal{background:#1A9BB5}

/* hub rows */
.hubrow{transition:background-color .2s}
.hubrow.sel{background:var(--fill2)}
.hub-hit{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
.hubrow:active .icotile{transform:scale(.88)}
.hubrow.new{animation:rowIn .7s cubic-bezier(.2,1.2,.3,1)}
.hubrow.new::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,color-mix(in srgb,var(--accent) 30%,transparent) 50%,transparent 80%);background-size:250% 100%;animation:shine 1.2s ease-out forwards;pointer-events:none}
@keyframes rowIn{0%{opacity:0;transform:translateY(-12px) scale(.97)}100%{opacity:1;transform:none}}
@keyframes shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
.chev{flex:none;color:var(--label3)}
.hubrow.sel .chev{color:var(--accent)}

/* status dots */
.dot{position:relative;display:inline-block;flex:none;width:8px;height:8px;border-radius:999px}
.dot-on{background:var(--green)}
.dot-on::after{content:"";position:absolute;inset:0;border-radius:999px;background:var(--green);animation:ping 2s ease-out infinite}
.dot-off{background:var(--gray)}
.dot-busy{background:var(--orange);animation:blink 1s ease-in-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.2);opacity:0}}
@keyframes blink{50%{opacity:.35}}

/* segmented control */
.seg{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:2px;border-radius:9px;background:var(--fill2);width:100%;max-width:600px}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / 4);border-radius:7px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .45s cubic-bezier(.3,1.35,.45,1)}
.seg-btn{position:relative;z-index:1;min-height:40px;padding:0 8px;border:0;background:none;color:var(--label);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .3s}
.seg-btn:active{transform:scale(.95)}
.seg-btn.act{font-weight:600}
.seg-n{font-size:12px;color:var(--label2);font-weight:500}

/* Home-style tiles */
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:128px;padding:14px;border-radius:18px;background:var(--tile);color:var(--label);transition:transform .5s cubic-bezier(.25,1.6,.4,1),background-color .3s,color .3s,box-shadow .4s}
.tile:active{transform:scale(.94);transition-duration:.15s}
.tile-hit{position:absolute;inset:0;z-index:2;border:0;border-radius:18px;background:none;cursor:pointer;padding:0}
.tile-hit:disabled{cursor:default}
.tile .t2{color:var(--label2);transition:color .3s}
.tile.on{background:#FFFFFF;color:#000;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.tile.on .t2{color:#636366}
.ticon{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--fill);color:var(--label);transition:background-color .3s,color .3s}
.tile.on.k-light .ticon{background:#FFD60A;color:#1C1C1E}
.tile.on.k-relay .ticon{background:#30D158;color:#06260F}
.tile.flash .ticon svg{animation:bounce .55s cubic-bezier(.3,1.6,.45,1)}
.tile.flash{animation:tglow .7s ease-out}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(.72)}65%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes tglow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--yellow) 55%,transparent)}100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--yellow) 0%,transparent)}}
.tile.new{animation:tileIn .8s cubic-bezier(.2,1.4,.35,1)}
.tile.new::after{content:"";position:absolute;inset:-2px;border-radius:20px;border:2px solid var(--accent);animation:fadeRing 2.6s ease-out forwards;pointer-events:none}
@keyframes tileIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
@keyframes fadeRing{0%,60%{opacity:1}100%{opacity:0}}
.tile.intv .rd{background:linear-gradient(90deg,var(--label2) 0%,var(--label) 50%,var(--label2) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.dimmed{opacity:.45;pointer-events:none;filter:saturate(.3);transition:opacity .3s}

/* signal bars */
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.sig i{display:block;width:3px;border-radius:1px;background:currentColor}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:9px}.sig i:nth-child(4){height:12px}
.lv1 i:nth-child(n+2),.lv2 i:nth-child(n+3),.lv3 i:nth-child(4){opacity:.28}

/* permit join (AirDrop-like radiating) */
.pj{position:relative;display:inline-flex}
.pj .ring{position:absolute;inset:0;border-radius:999px;border:2px solid var(--accent);opacity:0;pointer-events:none}
.pj.live .ring{animation:radiate 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.pj.live .ring:nth-child(2){animation-delay:.8s}
.pj.live .ring:nth-child(3){animation-delay:1.6s}
@keyframes radiate{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.25,1.9);opacity:0}}
.wave path{transition:opacity .2s}
.pj.live .wave .w1{animation:vc 1.2s infinite}
.pj.live .wave .w2{animation:vc 1.2s .2s infinite}
.pj.live .wave .w3{animation:vc 1.2s .4s infinite}
@keyframes vc{0%,100%{opacity:.3}40%{opacity:1}}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{position:absolute;top:0;left:0;right:0;height:3px;overflow:hidden}
.progress span{position:absolute;top:0;bottom:0;width:35%;border-radius:999px;background:var(--accent);animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{left:-35%}100%{left:100%}}

/* network map */
.map{position:relative;width:100%;aspect-ratio:16 / 10;border-radius:16px;overflow:hidden;background-color:var(--grp);background-image:radial-gradient(circle,var(--fill) 1px,transparent 1.3px);background-size:22px 22px}
.map-ring{position:absolute;left:50%;top:50%;border:1px dashed var(--sep);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.q-good{background:repeating-linear-gradient(90deg,var(--green) 0 14px,color-mix(in srgb,var(--green) 40%,transparent) 14px 20px)}
.q-mid{background:repeating-linear-gradient(90deg,var(--orange) 0 8px,transparent 8px 14px)}
.q-bad{background:repeating-linear-gradient(90deg,var(--red) 0 3px,transparent 3px 8px)}
.link{position:absolute;z-index:1;height:2px;margin-top:-1px;transform-origin:0 50%;border-radius:2px;pointer-events:none}
.link.q-good{animation:drawLine .7s cubic-bezier(.2,.8,.2,1) backwards,flow20 .8s linear infinite}
.link.q-mid{animation:drawLine .7s cubic-bezier(.2,.8,.2,1) backwards,flow14 1s linear infinite}
.link.q-bad{animation:drawLine .7s cubic-bezier(.2,.8,.2,1) backwards,flow8 1.4s linear infinite}
@keyframes drawLine{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes flow20{from{background-position:0 0}to{background-position:-20px 0}}
@keyframes flow14{from{background-position:0 0}to{background-position:-14px 0}}
@keyframes flow8{from{background-position:0 0}to{background-position:-8px 0}}
.lgl{display:inline-block;width:28px;height:3px;border-radius:2px;vertical-align:middle;margin-right:8px}
.node{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;padding:0;border:0;background:none;color:var(--label);cursor:pointer;animation:nFade .35s ease-out backwards}
.node.end{transform:translate(-50%,-18px)}
.node.router{transform:translate(-50%,-21px)}
.node.coord{transform:translate(-50%,-30px);z-index:3}
@keyframes nFade{from{opacity:0}to{opacity:1}}
@keyframes nPop{from{transform:scale(.2)}to{transform:scale(1)}}
.nd{position:relative;flex:none;width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--grp2);border:2px solid var(--sep);color:var(--label);animation:nPop .55s cubic-bezier(.2,1.5,.35,1) backwards;animation-delay:inherit;transition:transform .4s cubic-bezier(.3,1.6,.45,1),border-color .2s,box-shadow .3s}
.node:hover .nd{transform:scale(1.1)}
.node:active .nd{transform:scale(.86);transition-duration:.12s}
.node.router .nd{width:42px;height:42px;border-color:var(--accent)}
.node.coord .nd{width:60px;height:60px;border:0;background:var(--accent-fill);color:#fff}
.node.coord.offline .nd{background:var(--gray)}
.node.coord .nd::after{content:"";position:absolute;inset:-2px;border-radius:999px;border:2px solid var(--accent);animation:radiate2 2.6s ease-out infinite;pointer-events:none}
.node.coord.offline .nd::after{display:none}
@keyframes radiate2{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.node.picked .nd{border-color:var(--label);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}
.node.picked .nd::before{content:"";position:absolute;inset:-8px;border-radius:999px;border:2px solid var(--accent);animation:radiate2 1.5s ease-out infinite;pointer-events:none}
.nl{max-width:120px;padding:1px 6px;border-radius:6px;background:color-mix(in srgb,var(--grp) 88%,transparent);font-size:11px;line-height:14px;font-weight:600;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.picked .nl{color:var(--label)}
.sweep{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 38%,transparent),transparent 22%);transform:translate(-50%,-50%);animation:sweepRot 1.1s linear infinite;pointer-events:none}
@keyframes sweepRot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.map-off{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;background:color-mix(in srgb,var(--grp) 72%,transparent)}
.calm .link{animation:none}

/* log */
.log{font-family:var(--mono);font-size:12px;line-height:18px}
.logrow{display:grid;grid-template-columns:68px minmax(0,1fr);gap:2px 14px;padding:10px 16px;position:relative}
.logrow:not(:first-child)::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;transform:scaleY(.5);transform-origin:top;background:var(--sep)}
.logrow .pl{grid-column:2;color:var(--label2);overflow-wrap:anywhere}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .3s ease-out}
.sheet{width:100%;max-width:540px;max-height:calc(100vh - 32px);overflow:auto;background:var(--sheet);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:sheetIn .55s cubic-bezier(.2,1.15,.3,1)}
@keyframes fade{from{opacity:0}}
@keyframes sheetIn{0%{transform:translateY(60px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
.navbtn{min-height:44px;padding:0 4px;border:0;background:none;color:var(--accent);font-size:17px;cursor:pointer;transition:opacity .2s,transform .3s}
.navbtn:active{opacity:.4}
.frow{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px}
.frow:not(:first-child)::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;transform:scaleY(.5);transform-origin:top;background:var(--sep)}
.frow label{flex:none;width:132px;font-size:17px;color:var(--label)}
.frow input,.frow select{flex:1;min-width:0;min-height:44px;border:0;background:none;color:var(--label);font-size:17px;text-align:right;outline:none}
.frow input::placeholder{color:var(--label3)}
.frow select{appearance:none;-webkit-appearance:none;color:var(--label2);cursor:pointer;direction:rtl}
.frow option{direction:ltr;color:#000}
.frow.err label{color:var(--red)}
.frow.err{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* HUD toast */
.toast{position:fixed;left:50%;bottom:28px;z-index:60;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 20px 0 14px;border-radius:999px;background:rgba(40,40,42,.92);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);color:#fff;font-size:15px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.35);transform:translateX(-50%);animation:toastIn 2.6s cubic-bezier(.2,1.2,.3,1) forwards;pointer-events:none;white-space:nowrap}
.toast .ck{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .25s ease-out forwards}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,30px) scale(.9)}14%{opacity:1;transform:translate(-50%,0) scale(1)}86%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,10px) scale(.96)}}
@keyframes draw{to{stroke-dashoffset:0}}

/* calm mode + reduced motion */
.calm .fired,.calm .flash,.calm .new,.calm .tile.flash .ticon svg{animation:none}
.calm .fired::before,.calm .hubrow.new::after,.calm .tile.new::after{display:none}
@media (prefers-reduced-motion: reduce){.root *,.root *::before,.root *::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
<style>
.dc-panel{position:fixed;left:16px;bottom:16px;z-index:100;display:flex;flex-wrap:wrap;gap:6px;padding:6px;border-radius:999px;background:rgba(120,120,128,.22);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);font:500 12px/16px -apple-system,BlinkMacSystemFont,Inter,sans-serif}
.dc-panel button{min-height:32px;padding:0 12px;border:0;border-radius:999px;background:rgba(255,255,255,.75);color:#1c1c1e;font:inherit;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.45,1)}
.dc-panel button:active{transform:scale(.92)}
.dc-panel button span{color:#6e6e73}
.pg-dark .dc-panel button{background:rgba(44,44,46,.85);color:#fff}
.pg-dark .dc-panel button span{color:rgba(235,235,245,.6)}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div class="root {{themeCls}} {{fxMode}}" style="--accent: {{acc.text}}; --accent-fill: {{acc.fill}}; min-height: 100vh; background: var(--bg); color: var(--label); font-family: var(--sans); padding: 32px clamp(16px, 4vw, 48px) 72px; transition: background-color .3s;">
<div style="max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;">

<header style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: space-between;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<nav aria-label="Навигация" style="display: flex; align-items: center; gap: 6px; font-size: 15px; line-height: 20px; color: var(--label2);">
<a href="#" style="color: var(--accent); text-decoration: none;">BMS</a>
<svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 1.5 6.5 6 2 10.5"></path></svg>
<a href="#" style="color: var(--accent); text-decoration: none;">Интеграции</a>
<svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 1.5 6.5 6 2 10.5"></path></svg>
<span>Zigbee</span>
</nav>
<h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px;">Zigbee2MQTT</h1>
<p style="margin: 0; max-width: 640px; font-size: 15px; line-height: 20px; color: var(--label2);">Несколько координаторов в одной BMS. Каждый хаб публикует в свой базовый топик на общем MQTT-брокере.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">

Добавить хаб
</button>
</div>
</header>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">

<div style="font-family: var(--round); font-size: 34px; line-height: 41px; font-weight: 700;">{{kpi.online}}<span style="font-size: 20px; color: var(--label2); font-weight: 600;"> из {{kpi.total}}</span></div>
</div>
<div class="group" style="padding: 16px; display: flex; flex-direction: column; gap: 10px; border-radius: 16px;">
<div style="display: flex; align-items: center; gap: 8px;"><span class="icotile ti-blue" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"></circle><circle cx="19" cy="6" r="2"></circle><circle cx="12" cy="18" r="2"></circle><path d="M6.8 7.2 10.6 16.3M17.2 7.2 13.4 16.3M7 6h10"></path></svg></span><span style="font-size: 15px; font-weight: 600; color: var(--label2);">Устройства</span></div>
<div style="font-family: var(--round); font-size: 34px; line-height: 41px; font-weight: 700;">{{kpi.devOnline}}<span style="font-size: 20px; color: var(--label2); font-weight: 600;"> из {{kpi.devTotal}}</span></div>
</div>
<div class="group" style="padding: 16px; display: flex; flex-direction: column; gap: 10px; border-radius: 16px;">
<div style="display: flex; align-items: center; gap: 8px;"><span class="icotile ti-indigo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11M4 12h16M4 17h8"></path></svg></span><span style="font-size: 15px; font-weight: 600; color: var(--label2);">Сообщений в мин</span></div>
<div style="font-family: var(--round); font-size: 34px; line-height: 41px; font-weight: 700;">{{kpi.rate}}</div>
</div>
<div class="group" style="padding: 16px; display: flex; flex-direction: column; gap: 10px; border-radius: 16px;">
<div style="display: flex; align-items: center; gap: 8px;"><span class="icotile ti-teal" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="1.6" fill="currentColor"></circle><path d="M8.5 9.5a5 5 0 0 0 0 7M15.5 9.5a5 5 0 0 1 0 7M5.6 6.6a9 9 0 0 0 0 12.8M18.4 6.6a9 9 0 0 1 0 12.8"></path></svg></span><span style="font-size: 15px; font-weight: 600; color: var(--label2);">Сопряжение</span></div>
<div style="font-family: var(--round); font-size: 34px; line-height: 41px; font-weight: 700;">{{kpi.pj}}</div>
</div>
</div>

<div class="group" style="border-radius: 12px;">
<div class="row" style="min-height: 60px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px;">
<span class="icotile ti-gray" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 7.5h.01M7 16.5h.01"></path></svg></span>
<div style="flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 17px; line-height: 22px;">MQTT-брокер</span>
<span style="font-size: 13px; line-height: 18px; color: var(--label2); font-family: var(--mono);">mqtt://10.0.0.5:1883 · Mosquitto 2.0</span>
</div>
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--label2);"><span class="dot dot-on"></span>{{brokerNote}}</span>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start;">

<section aria-labelledby="hubs-h" style="flex: 1 1 320px; max-width: 420px; min-width: 0; display: flex; flex-direction: column;">
<h2 id="hubs-h" class="ghead">Хабы · {{kpi.total}}</h2>
<div class="group">
<sc-for list="{{hubs}}" as="h" hint-placeholder-count="3">
<div class="row hubrow {{h.cls}}">
<button type="button" class="hub-hit" onClick="{{h.select}}" aria-pressed="{{h.selected}}">
<span class="icotile {{h.tile}}" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="8" width="10" height="13" rx="2.5"></rect><path d="M9.5 8V4h5v4M10 13h4"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 17px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{h.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--label2); white-space: nowrap; overflow: hidden;"><span class="dot {{h.dot}}"></span>{{h.statusText}} · {{h.devCount}} устр. · канал {{h.channel}}</span>
</span>
</button>
<button type="button" class="sw {{h.swCls}}" role="switch" aria-checked="{{h.ariaOn}}" aria-label="Хаб {{h.name}} активен" onClick="{{h.toggle}}"><span class="knob"></span></button>
</div>
</sc-for>
<div class="row">

<span class="icotile ti-green" aria-hidden="true" style="border-radius: 999px; width: 26px; height: 26px; margin: 0 2px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="font-size: 17px;">Добавить хаб…</span>
</button>
</div>
</div>
<p class="gfoot">Хабы работают параллельно. Отключённый хаб перестаёт публиковать данные, но сохраняет конфигурацию и сопряжённые устройства.</p>
</section>

<section aria-labelledby="cur-h" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px;">
<sc-if value="{{hasHub}}" hint-placeholder-val="{{true}}">
<div class="group" style="position: relative; padding: 20px; display: flex; flex-direction: column; gap: 18px; border-radius: 16px;">
<sc-if value="{{cur.busy}}" hint-placeholder-val="{{false}}"><div class="progress" aria-hidden="true"><span></span></div></sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between;">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--label2);"><span class="dot {{cur.dot}}"></span>{{cur.statusText}} · {{cur.adapter}}</span>
<h2 id="cur-h" style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700;">{{cur.name}}</h2>
<span style="font-family: var(--mono); font-size: 13px; line-height: 18px; color: var(--label2); overflow-wrap: anywhere;">{{cur.topic}} · {{cur.port}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
<span class="{{pj.wrap}}">
<span class="ring"></span><span class="ring"></span><span class="ring"></span>
<button type="button" class="{{pj.btn}}" onClick="{{permitJoin}}" disabled="{{cur.notOnline}}" aria-pressed="{{pj.on}}">
<svg class="wave" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="1.8" fill="currentColor" stroke="none"></circle><path class="w1" d="M8.5 9.5a5 5 0 0 0 0 7M15.5 9.5a5 5 0 0 1 0 7"></path><path class="w2" d="M5.6 6.6a9 9 0 0 0 0 12.8M18.4 6.6a9 9 0 0 1 0 12.8"></path><path class="w3" d="M3 4a12.5 12.5 0 0 0 0 18M21 4a12.5 12.5 0 0 1 0 18"></path></svg>
{{pj.label}}
</button>
</span>
<button type="button" class="btn {{fx.rs}}" onClick="{{restart}}" disabled="{{cur.notOnline}}" aria-label="Перезапустить хаб">
<svg class="{{cur.spin}}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg>
Перезапустить
</button>
<button type="button" class="btn btn-red {{del.cls}}" onClick="{{removeHub}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
{{del.label}}
</button>
</div>
</div>
<div class="seg" role="tablist" aria-label="Раздел хаба">

<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" class="seg-btn {{t.cls}}" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}">{{t.label}}<sc-if value="{{t.hasN}}" hint-placeholder-val="{{false}}"><span class="seg-n">{{t.n}}</span></sc-if></button>
</sc-for>
</div>
</div>

<sc-if value="{{tabDevices}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column;">

<div class="group" style="padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; border-radius: 16px;">
<span class="icotile ti-gray" aria-hidden="true" style="width: 56px; height: 56px; border-radius: 14px;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"></path><path d="M6.3 7.5a8 8 0 1 0 11.4 0"></path></svg></span>
<h3 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 600;">Хаб отключён</h3>
<p style="margin: 0; max-width: 360px; font-size: 15px; line-height: 20px; color: var(--label2);">Включите хаб, чтобы его устройства снова появились в BMS.</p>
<button type="button" class="btn btn-fill {{fx.wake}}" onClick="{{wakeHub}}">Включить хаб</button>
</div>
</sc-if>
<sc-if value="{{cur.empty}}" hint-placeholder-val="{{false}}">
<div class="group" style="padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; border-radius: 16px;">
<span class="icotile ti-teal" aria-hidden="true" style="width: 56px; height: 56px; border-radius: 14px;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="1.6" fill="currentColor"></circle><path d="M8.5 9.5a5 5 0 0 0 0 7M15.5 9.5a5 5 0 0 1 0 7M5.6 6.6a9 9 0 0 0 0 12.8M18.4 6.6a9 9 0 0 1 0 12.8"></path></svg></span>
<h3 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 600;">Устройств пока нет</h3>

</div>
</sc-if>
<sc-if value="{{cur.hasDevices}}" hint-placeholder-val="{{true}}">
<div class="{{cur.gridCls}}" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px;">

<div class="tile {{d.cls}}">

</sc-if>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;">
<span class="ticon" aria-hidden="true">
<sc-if value="{{d.isLight}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg></sc-if>
<sc-if value="{{d.isRelay}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v4"></path></svg></sc-if>
<sc-if value="{{d.isSensor}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"></path></svg></sc-if>
<sc-if value="{{d.isMotion}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.8"></circle><path d="M9 21l2.5-6.5L14 17v4M10 11l2.5-3.5 3 2 2.5.5M12.5 7.5l-1 7M7 12.5l3-1.5"></path></svg></sc-if>
<sc-if value="{{d.isDoor}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14.5 12h.01"></path></svg></sc-if>
<sc-if value="{{d.isClimate}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"></path></svg></sc-if>
<sc-if value="{{d.isLeak}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"></path></svg></sc-if>
</span>
<span class="t2" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px;">
<span class="sig {{d.lv}}" aria-label="Сигнал LQI {{d.lqi}}"><i></i><i></i><i></i><i></i></span>
</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
<span style="font-size: 15px; line-height: 20px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{d.name}}</span>
<span class="t2 rd" style="font-size: 13px; line-height: 18px;">{{d.readout}}</span>
<span class="t2" style="font-size: 12px; line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{d.model}} · {{d.power}}</span>
</div>
</div>
</sc-for>
</div>
</sc-if>
</div>

<sc-if value="{{tabMqtt}}" hint-placeholder-val="{{false}}">

<div class="row plain"><span style="flex: 1; font-size: 17px;">Клиент ID</span><span style="font-family: var(--mono); font-size: 14px; color: var(--label2);">{{cur.clientId}}</span></div>
<div class="row plain"><span style="flex: 1; font-size: 17px;">Адаптер</span><span style="font-size: 15px; color: var(--label2); text-align: right;">{{cur.adapter}}</span></div>
<div class="row plain"><span style="flex: 1; font-size: 17px;">Порт</span><span style="font-family: var(--mono); font-size: 14px; color: var(--label2); overflow-wrap: anywhere; text-align: right;">{{cur.port}}</span></div>
<div class="row plain"><span style="flex: 1; font-size: 17px;">Канал · PAN ID</span><span style="font-family: var(--mono); font-size: 14px; color: var(--label2);">{{cur.channel}} · {{cur.pan}}</span></div>
<div class="row plain"><span style="flex: 1; font-size: 17px;">QoS</span><span style="font-size: 15px; color: var(--label2);">1</span></div>

</div>
</sc-for>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{tabMap}}" hint-placeholder-val="{{false}}">

{{map.scanLabel}}
</button>

<span class="nd" aria-hidden="true">
<sc-if value="{{n.isLight}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg></sc-if>
<sc-if value="{{n.isRelay}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v4"></path></svg></sc-if>
<sc-if value="{{n.isSensor}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"></path></svg></sc-if>
<sc-if value="{{n.isMotion}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.8"></circle><path d="M9 21l2.5-6.5L14 17v4M10 11l2.5-3.5 3 2 2.5.5M12.5 7.5l-1 7M7 12.5l3-1.5"></path></svg></sc-if>
<sc-if value="{{n.isDoor}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14.5 12h.01"></path></svg></sc-if>
<sc-if value="{{n.isClimate}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"></path></svg></sc-if>
<sc-if value="{{n.isLeak}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"></path></svg></sc-if>
</span>
<span class="nl">{{n.name}}</span>
</button>
</sc-for>
</sc-if>
<button type="button" class="{{map.coordCls}}" style="left: 50%; top: 50%;" onClick="{{map.pickCoord}}" aria-pressed="{{map.coordPicked}}" aria-label="Координатор {{cur.name}}">
<span class="nd" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="8" width="10" height="13" rx="2.5"></rect><path d="M9.5 8V4h5v4M10 13h4"></path></svg></span>
<span class="nl">Координатор</span>
</button>
<sc-if value="{{map.off}}" hint-placeholder-val="{{false}}">
<div class="map-off">
<h4 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600;">Хаб отключён</h4>
<p style="margin: 0; font-size: 15px; line-height: 20px; color: var(--label2);">Карта строится только для хаба в сети.</p>
</div>
</sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; line-height: 18px; color: var(--label2);">
<span><span class="lgl q-good"></span>Хорошая связь · LQI 140+</span>
<span><span class="lgl q-mid"></span>Средняя · 80–140</span>
<span><span class="lgl q-bad"></span>Слабая · до 80</span>
<span>Синий контур — роутер, серый — конечное устройство</span>
</div>
<div>
<h3 class="ghead">Выбранный узел</h3>
<div class="group">
<sc-for list="{{map.info}}" as="r" hint-placeholder-count="5">
<div class="row plain" style="min-height: 44px;"><span style="flex: 1; font-size: 17px;">{{r.k}}</span><span style="font-size: 15px; color: var(--label2); text-align: right; overflow-wrap: anywhere;">{{r.v}}</span></div>
</sc-for>
</div>
<p class="gfoot">Нажмите на узел на карте, чтобы увидеть его маршрут и качество связи.</p>
</div>
</div>
</sc-if>

<sc-if value="{{tabLog}}" hint-placeholder-val="{{false}}">
<div>
<h3 class="ghead">Последние сообщения</h3>
<div class="group log">
<sc-for list="{{logs}}" as="l" hint-placeholder-count="5">
<div class="logrow"><span style="color: var(--label2);">{{l.t}}</span><span style="color: var(--accent); overflow-wrap: anywhere;">{{l.topic}}</span><span class="pl">{{l.payload}}</span></div>
</sc-for>
<sc-if value="{{noLogs}}" hint-placeholder-val="{{false}}"><div class="logrow"><span></span><span style="color: var(--label2);">Сообщений пока нет</span></div></sc-if>
</div>
<p class="gfoot">Нажмите на плитку освещения или реле — команда /set появится здесь.</p>
</div>
</sc-if>
</sc-if>

<sc-if value="{{noHub}}" hint-placeholder-val="{{false}}">
<div class="group" style="padding: 56px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; border-radius: 16px;">
<span class="icotile ti-blue" aria-hidden="true" style="width: 56px; height: 56px; border-radius: 14px;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="8" width="10" height="13" rx="2.5"></rect><path d="M9.5 8V4h5v4"></path></svg></span>
<h3 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 600;">Нет подключённых хабов</h3>
<p style="margin: 0; max-width: 360px; font-size: 15px; line-height: 20px; color: var(--label2);">Добавьте первый координатор Zigbee, чтобы BMS начала получать данные.</p>
<button type="button" class="btn btn-fill" onClick="{{openSheet}}">Добавить хаб</button>
</div>
</sc-if>
</section>
</div>
</div>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
<div class="scrim">
<form class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h" onSubmit="{{submit}}">
<div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--sep);">
<button type="button" class="navbtn" onClick="{{closeSheet}}" style="justify-self: start;">Отмена</button>
<h2 id="sheet-h" style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600;">Новый хаб</h2>
<button type="submit" class="navbtn" style="justify-self: end; font-weight: 600;">Добавить</button>
</div>
<div style="padding: 24px 16px 28px; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
<span class="icotile ti-blue" aria-hidden="true" style="width: 64px; height: 64px; border-radius: 15px;"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="8" width="10" height="13" rx="2.5"></rect><path d="M9.5 8V4h5v4M10 13h4"></path></svg></span>
<p style="margin: 0; max-width: 380px; font-size: 15px; line-height: 20px; color: var(--label2);">Подключите координатор по USB или по сети. Хаб получит собственный экземпляр Zigbee2MQTT.</p>
</div>
<div>
<div class="group">
<div class="frow {{err.name}}"><label for="f-name">Название</label><input id="f-name" type="text" placeholder="Хаб · Этаж 3" value="{{form.name}}" onChange="{{onName}}" autocomplete="off"></div>
<div class="frow"><label for="f-driver">Адаптер</label><select id="f-driver" value="{{form.driver}}" onChange="{{onDriver}}"><option value="ember">SONOFF ZBDongle-E · ember</option><option value="zstack">SMLIGHT SLZB-06 · zstack</option><option value="deconz">ConBee II · deconz</option><option value="zigate">ZiGate+ · zigate</option></select></div>
<div class="frow {{err.port}}"><label for="f-port">Порт</label><input id="f-port" type="text" placeholder="/dev/ttyUSB1 или tcp://…" value="{{form.port}}" onChange="{{onPort}}" autocomplete="off"></div>
</div>
<sc-if value="{{err.any}}" hint-placeholder-val="{{false}}"><p class="gfoot" style="color: var(--red);">Заполните название и порт координатора.</p></sc-if>
</div>
<div>
<h3 class="ghead">Сеть</h3>
<div class="group">
<div class="frow"><label for="f-topic">Базовый топик</label><input id="f-topic" type="text" placeholder="{{topicHint}}" value="{{form.topic}}" onChange="{{onTopic}}" autocomplete="off" style="font-family: var(--mono); font-size: 15px;"></div>
<div class="frow"><label for="f-ch">Канал</label><select id="f-ch" value="{{form.channel}}" onChange="{{onChannel}}"><option value="11">11</option><option value="15">15</option><option value="20">20</option><option value="25">25</option></select></div>
</div>
<p class="gfoot">Разносите соседние хабы по разным каналам, чтобы они не мешали друг другу и Wi-Fi.</p>
</div>
</div>
</form>
</div>
</sc-if>

<sc-if value="{{toast.show}}" hint-placeholder-val="{{false}}">
<div class="toast" role="status">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#30D158"></circle><path class="ck" d="M7.5 12.5l3 3 6-6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
{{toast.text}}
</div>
</sc-if>
</div>
</template>

      this.patchHub(hid, hh => ({ devices: hh.devices.map(x => x.id === did ? Object.assign({}, x, { interviewing: false }) : x) }));
      this.addLog(hid, h.topic + '/bridge/event', '{"type":"device_interview","data":{"status":"successful","model":"' + p[2] + '"}}');
      this.showToast('Подключено: ' + p[2]);
    }, 2600);
    this.later(() => this.patchHub(hid, hh => ({ devices: hh.devices.map(x => x.id === did ? Object.assign({}, x, { isNew: false }) : x) })), 3200);
  }

  restart() {
    const id = this.state.sel; const h = this.hub(id);
    if (!h || h.status !== 'online') return;
    this.fire('rs');
    if (this.state.pj && this.state.pj.hub === id) this.stopPj();
    this.setState({ restarting: id });
    this.patchHub(id, { status: 'restarting' });
    this.addLog(id, h.topic + '/bridge/request/restart', '""');
    this.later(() => {
      this.setState({ restarting: null });
      const x = this.hub(id);
      if (x && x.enabled) {
        this.patchHub(id, { status: 'online' });
        this.addLog(id, h.topic + '/bridge/state', '{"state":"online"}');
        this.showToast(h.name + ' перезапущен');
      }
    }, 2600);
  }

  removeHub() {
    const id = this.state.sel;
    if (this.state.confirmDel !== id) {
      this.setState({ confirmDel: id }); this.fire('del');
      this.later(() => { if (this.state.confirmDel === id) this.setState({ confirmDel: null }); }, 3000);
      return;
    }
    if (this.state.pj && this.state.pj.hub === id) this.stopPj();
    const h = this.hub(id);
    const rest = this.state.hubs.filter(x => x.id !== id);
    this.setState({ hubs: rest, sel: rest.length ? rest[0].id : null, confirmDel: null, tab: 'devices' });
    if (h) this.showToast(h.name + ' удалён');
  }

  checkBroker() {
    this.fire('broker');
    this.setState({ brokerNote: 'Проверка…' });
    this.later(() => {
      const ms = 2 + Math.floor(Math.random() * 5);
      this.setState({ brokerNote: 'Подключён · ответ ' + ms + ' мс' });
      this.showToast('Брокер отвечает · ' + ms + ' мс');
    }, 900);
  }

  openSheet() {
    this.fire('add');
    this.setState({ sheet: true, errs: {}, form: { name: '', driver: 'ember', port: '', topic: '', channel: '25' } });
  }

  field(k) {
    return (e) => {
      const v = e && e.target ? e.target.value : '';
      this.setState(s => ({ form: Object.assign({}, s.form, { [k]: v }), errs: Object.assign({}, s.errs, { [k]: false }) }));
    };
  }

  submit(e) {
    if (e && e.preventDefault) e.preventDefault();
    const f = this.state.form;
    const errs = { name: !f.name.trim(), port: !f.port.trim() };
    if (errs.name || errs.port) {
      this.setState({ errs: {} });
      setTimeout(() => this.setState({ errs }), 20);
      return;
    }
    const n = this.state.seq; const id = 'h' + n;
    const topic = f.topic.trim() || ('zigbee2mqtt/hub' + (this.state.hubs.length + 1));
    const hub = { id, name: f.name.trim(), driver: f.driver, port: f.port.trim(), topic, channel: Number(f.channel), pan: '0x' + (0x4000 + (n * 911) % 0xBFFF).toString(16).toUpperCase(), enabled: true, status: 'connecting', isNew: true, opts: { availability: true, lastSeen: true, retain: false, bmsMap: true }, devices: [] };
    this.setState(s => ({ hubs: s.hubs.concat([hub]), sel: id, tab: 'devices', sheet: false, seq: s.seq + 1 }));
    this.later(() => {
      const x = this.hub(id);
      if (x && x.enabled) { this.patchHub(id, { status: 'online' }); this.addLog(id, topic + '/bridge/state', '{"state":"online"}'); }
      this.showToast(hub.name + ' добавлен');
    }, 1600);
    this.later(() => this.patchHub(id, { isNew: false }), 2400);
  }

  scanMap() {
    const id = this.state.sel; const h = this.hub(id);
    if (!h || h.status !== 'online' || this.state.scanning) return;
    this.fire('scan');
    this.setState({ scanning: true });
    this.addLog(id, h.topic + '/bridge/request/networkmap', '{"type":"raw","routes":true}');
    this.later(() => {
      this.patchHub(id, hh => ({ devices: hh.devices.map(d => Object.assign({}, d, { lqi: Math.max(25, Math.min(255, d.lqi + Math.round((Math.random() - 0.5) * 40))) })) }));
      this.setState({ scanning: false });
      this.showToast('Карта сети обновлена');
    }, 2000);
  }

  mapData(ch, W, H, k) {
    const s = this.state;
    const cx = W / 2, cy = H / 2;
    const devs = ch.devices.filter(d => !d.interviewing);
    const routers = devs.filter(d => d.bat == null);
    const ends = devs.filter(d => d.bat != null);
    const P = {};
    const nR = Math.max(routers.length, 1), nE = Math.max(ends.length, 1);
    routers.forEach((d, i) => { const a = -Math.PI / 2 + 0.35 + i * 2 * Math.PI / nR; P[d.id] = { x: cx + Math.cos(a) * W * k[0], y: cy + Math.sin(a) * H * k[1], parent: null }; });
    ends.forEach((d, i) => {
      const a = -Math.PI / 2 + 0.35 + (i + 0.5) * 2 * Math.PI / nE;
      const p = { x: cx + Math.cos(a) * W * k[2], y: cy + Math.sin(a) * H * k[3], parent: null };
      let best = Math.hypot(p.x - cx, p.y - cy);
      routers.forEach(r => { const dd = Math.hypot(p.x - P[r.id].x, p.y - P[r.id].y); if (dd < best) { best = dd; p.parent = r.id; } });
      P[d.id] = p;
    });
    const q = l => (l > 140 ? 'q-good' : l >= 80 ? 'q-mid' : 'q-bad');
    const qt = l => (l > 140 ? 'хорошая' : l >= 80 ? 'средняя' : 'слабая');
    const pct = (x, y) => ({ x: +(x / W * 100).toFixed(2), y: +(y / H * 100).toFixed(2) });
    const link = (x1, y1, x2, y2, lqi, i) => Object.assign(pct(x1, y1), { w: +(Math.hypot(x2 - x1, y2 - y1) / W * 100).toFixed(2), a: +(Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI).toFixed(1), q: q(lqi), delay: 150 + i * 90 });
    const links = []; let li = 0;
    routers.forEach(r => links.push(link(cx, cy, P[r.id].x, P[r.id].y, r.lqi, li++)));
    ends.forEach(e => { const p = P[e.id]; const f = p.parent ? P[p.parent] : { x: cx, y: cy }; links.push(link(f.x, f.y, p.x, p.y, e.lqi, li++)); });
    const byId = {}; devs.forEach(d => { byId[d.id] = d; });
    const sel = byId[s.mapSel] ? s.mapSel : 'coord';
    const nodes = devs.map((d, i) => Object.assign(pct(P[d.id].x, P[d.id].y), {
      name: d.name, picked: sel === d.id ? 'true' : 'false', delay: 120 + i * 80,
      cls: 'node ' + (d.bat == null ? 'router' : 'end') + (sel === d.id ? ' picked' : ''),
      isLight: d.type === 'light', isRelay: d.type === 'relay', isSensor: d.type === 'sensor', isMotion: d.type === 'motion', isDoor: d.type === 'door', isClimate: d.type === 'climate', isLeak: d.type === 'leak',
      pick: () => this.setState({ mapSel: d.id })
    }));
    const AD = { ember: 'SONOFF ZBDongle-E', zstack: 'SMLIGHT SLZB-06', deconz: 'ConBee II', zigate: 'ZiGate+' };
    const d = byId[sel];
    const info = d ? [
      { k: 'Устройство', v: d.name },
      { k: 'Роль', v: d.bat == null ? 'Роутер' : 'Конечное устройство' },
      { k: 'Маршрут', v: (P[d.id].parent ? 'через «' + byId[P[d.id].parent].name + '»' : 'напрямую') + ' → координатор' },
      { k: 'LQI', v: d.lqi + ' · ' + qt(d.lqi) },
      { k: 'Модель', v: d.model },
      { k: 'Питание', v: d.bat == null ? 'сеть 220 В' : 'батарея ' + d.bat + ' %' }
    ] : [
      { k: 'Хаб', v: ch.name },
      { k: 'Роль', v: 'Координатор' },
      { k: 'Адаптер', v: AD[ch.driver] + ' · ' + ch.driver },
      { k: 'Канал · PAN ID', v: ch.channel + ' · ' + ch.pan },
      { k: 'Прямых соединений', v: String(routers.length + ends.filter(e => !P[e.id].parent).length) }
    ];
    const off = ch.status === 'offline';
    return {
      links, nodes, info, routers: routers.length, ends: ends.length,
      ready: !s.scanning && !off, scanning: s.scanning, off,
      spin: s.scanning ? 'spin' : '', scanLabel: s.scanning ? 'Сканирование…' : 'Обновить карту',
      cantScan: ch.status !== 'online' || s.scanning,
      coordCls: 'node coord' + (sel === 'coord' ? ' picked' : '') + (off ? ' offline' : ''),
      coordPicked: sel === 'coord' ? 'true' : 'false',
      pickCoord: () => this.setState({ mapSel: 'coord' })
    };
  }

  renderVals() {
    const s = this.state;
    const light = this.props.theme === 'light';
    const ACC = {
      blue: { text: light ? '#0071E3' : '#409CFF', fill: '#0071E3' },
      green: { text: light ? '#248A3D' : '#30D158', fill: '#248A3D' },
      orange: { text: light ? '#C93400' : '#FF9F0A', fill: '#C93400' },
      purple: { text: light ? '#8944AB' : '#DA8FFF', fill: '#8944AB' }
    };
    const acc = ACC[this.props.accent] || ACC.blue;
    const AD = { ember: 'SONOFF ZBDongle-E', zstack: 'SMLIGHT SLZB-06', deconz: 'ConBee II', zigate: 'ZiGate+' };
    const ST = { online: 'В сети', offline: 'Отключён', connecting: 'Подключение…', restarting: 'Перезапуск…' };
    const DOT = { online: 'dot-on', offline: 'dot-off', connecting: 'dot-busy', restarting: 'dot-busy' };
    const TILE = { online: 'ti-green', offline: 'ti-gray', connecting: 'ti-orange', restarting: 'ti-orange' };
    const fxc = k => (s.fx[k] ? 'fired' : '');

    const hubs = s.hubs.map(h => ({
      id: h.id, name: h.name, channel: h.channel, devCount: h.devices.length,
      statusText: ST[h.status], dot: DOT[h.status], tile: TILE[h.status],
      cls: (h.id === s.sel ? 'sel ' : '') + (h.isNew ? 'new' : ''),
      selected: h.id === s.sel,
      swCls: (h.enabled ? 'on ' : '') + fxc('sw' + h.id),
      ariaOn: h.enabled ? 'true' : 'false',
      select: () => this.setState({ sel: h.id, confirmDel: null, mapSel: 'coord' }),
      toggle: () => this.toggleHub(h.id)
    }));

    const ch = s.hubs.find(h => h.id === s.sel) || null;
    let cur = {}, devices = [], logs = [], opts = [];
    let pj = { wrap: 'pj', btn: 'btn ' + fxc('pj'), label: 'Разрешить подключение', on: false };
    let del = { cls: fxc('del'), label: 'Удалить' };
    if (ch) {
      const online = ch.status === 'online';
      const busy = ch.status === 'connecting' || ch.status === 'restarting';
      cur = {
        name: ch.name, topic: ch.topic, port: ch.port, channel: ch.channel, pan: ch.pan,
        adapter: AD[ch.driver] + ' · ' + ch.driver,
        statusText: ST[ch.status], dot: DOT[ch.status],
        notOnline: !online, busy, isOff: ch.status === 'offline',
        empty: ch.status !== 'offline' && ch.devices.length === 0,
        hasDevices: ch.status !== 'offline' && ch.devices.length > 0,
        gridCls: online ? '' : 'dimmed',
        spin: s.restarting === ch.id ? 'spin' : '',
        clientId: 'bms_' + ch.topic.split('/').pop()
      };
      const KIND = { light: 'k-light', relay: 'k-relay', sensor: 'k-sensor', motion: 'k-motion', door: 'k-door', climate: 'k-climate', leak: 'k-leak' };
      devices = ch.devices.map(d => {
        const act = d.type === 'light' || d.type === 'relay';
        const lv = d.lqi > 200 ? 'lv4' : d.lqi > 140 ? 'lv3' : d.lqi > 80 ? 'lv2' : 'lv1';
        return {
          id: d.id, name: d.name, model: d.model, lqi: d.lqi, lv,
          isLight: d.type === 'light', isRelay: d.type === 'relay', isSensor: d.type === 'sensor', isMotion: d.type === 'motion', isDoor: d.type === 'door', isClimate: d.type === 'climate', isLeak: d.type === 'leak',
          isActuator: act && !d.interviewing,
          readout: d.interviewing ? 'Интервью устройства…' : act ? (d.on ? (d.type === 'light' ? 'Вкл. · ' + d.bri + ' %' : 'Включено') : 'Выключено') : d.val,
          actionLabel: d.on ? 'выключить' : 'включить',
          cls: [KIND[d.type], act && d.on ? 'on' : '', d.isNew ? 'new' : '', s.fx['d' + d.id] ? 'flash' : '', d.interviewing ? 'intv' : ''].join(' '),
          ariaOn: d.on ? 'true' : 'false',
          power: d.bat == null ? 'сеть' : 'батарея ' + d.bat + ' %',
          disabled: !online,
          toggle: () => this.toggleDev(ch.id, d.id)
        };
      });
      logs = s.log.filter(l => l.hub === ch.id).slice(0, 14).map(l => ({ t: l.t, topic: l.topic, payload: l.payload }));
      const O = [
        { k: 'availability', label: 'Доступность', hint: 'online / offline для каждого устройства' },
        { k: 'lastSeen', label: 'Поле last_seen', hint: 'Время последнего сообщения, ISO 8601' },
        { k: 'retain', label: 'Retain', hint: 'Брокер хранит последнее состояние' },
        { k: 'bmsMap', label: 'Показывать в BMS', hint: 'Мнемосхемы, тренды и тревоги' }
      ];
      opts = O.map(o => ({ label: o.label, hint: o.hint, swCls: (ch.opts[o.k] ? 'on ' : '') + fxc('o' + o.k + ch.id), ariaOn: ch.opts[o.k] ? 'true' : 'false', toggle: () => this.toggleOpt(ch.id, o.k) }));
      const pjOn = !!(s.pj && s.pj.hub === ch.id);
      const left = pjOn ? s.pj.left : 0;
      pj = {
        wrap: pjOn ? 'pj live' : 'pj',
        btn: 'btn ' + (pjOn ? 'btn-fill ' : '') + fxc('pj'),
        label: pjOn ? 'Сопряжение · ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : 'Разрешить подключение',
        on: pjOn ? 'true' : 'false'
      };
      const armed = s.confirmDel === ch.id;
      del = { cls: (armed ? 'armed ' : '') + fxc('del'), label: armed ? 'Точно удалить?' : 'Удалить' };
    }

    const T = [
      { id: 'devices', label: 'Устройства', n: ch ? ch.devices.length : 0 },
      { id: 'mqtt', label: 'MQTT', n: null },
      { id: 'map', label: 'Карта сети', n: null },
      { id: 'log', label: 'Журнал', n: logs.length }
    ];
    const tabIndex = Math.max(0, T.findIndex(t => t.id === s.tab));
    const tabs = T.map(t => ({ label: t.label, n: t.n, hasN: t.n != null, cls: s.tab === t.id ? 'act' : '', sel: s.tab === t.id ? 'true' : 'false', pick: () => this.setState({ tab: t.id }) }));

    const onlineHubs = s.hubs.filter(h => h.status === 'online');
    const devTotal = s.hubs.reduce((a, h) => a + h.devices.length, 0);
    const devOnline = onlineHubs.reduce((a, h) => a + h.devices.length, 0);
    const pjHub = s.pj ? this.hub(s.pj.hub) : null;

    const err = s.errs || {};
    return {
      themeCls: light ? 'light' : 'dark',
      fxMode: this.props.effects === 'calm' ? 'calm' : '',
      acc,
      fx: { broker: fxc('broker'), add: fxc('add'), rs: fxc('rs'), wake: fxc('wake'), scan: fxc('scan') },
      map: ch ? this.mapData(ch, 1600, 1000, [0.22, 0.27, 0.4, 0.37]) : {},
      tabMap: s.tab === 'map',
      scanMap: () => this.scanMap(),
      kpi: { online: onlineHubs.length, total: s.hubs.length, devOnline, devTotal, rate: devOnline * 7 + onlineHubs.length * 3, pj: pjHub ? s.pj.left + ' с' : 'Закрыто' },
      brokerNote: s.brokerNote,
      hubs, hasHub: !!ch, noHub: !ch,
      cur, devices, logs, noLogs: logs.length === 0, opts, pj, del,
      tabs, tabX: tabIndex * 100,
      tabDevices: s.tab === 'devices', tabMqtt: s.tab === 'mqtt', tabLog: s.tab === 'log',
      permitJoin: () => this.permitJoin(),
      restart: () => this.restart(),
      removeHub: () => this.removeHub(),
      wakeHub: () => { this.fire('wake'); if (ch) this.toggleHub(ch.id); },
      checkBroker: () => this.checkBroker(),
      openSheet: () => this.openSheet(),
      closeSheet: () => this.setState({ sheet: false }),
      sheetOpen: s.sheet,
      form: s.form,
      err: { name: err.name ? 'err' : '', port: err.port ? 'err' : '', any: !!(err.name || err.port) },
      topicHint: 'zigbee2mqtt/hub' + (s.hubs.length + 1),
      onName: this.field('name'), onDriver: this.field('driver'), onPort: this.field('port'), onTopic: this.field('topic'), onChannel: this.field('channel'),
      submit: (e) => this.submit(e),
      toast: { show: !!s.toast, text: s.toast ? s.toast.text : '' }
    };
  }
}

window.__mountDC(Component, {"theme": "light", "accent": "blue", "effects": "calm"}, {});
</script>
