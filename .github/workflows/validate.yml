name: BMS package validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed release composition (before stage)
        run: node addon/tools/verify-stage.cjs
      - name: Harness tests
        run: |
          python -m pip install -r harness/requirements.txt
          cd harness
          python -m pytest -q
      - name: Build guard tests
        run: node --test addon/test/*.test.cjs
      - name: Clean core patches, build and tests
        run: bash core/build.sh
      - name: Clean Z2M patches, build and tests
        run: bash addon/tools/check-z2m.sh
      - name: Stage exact core and Tuya layer
        run: |
          bash addon/stage.sh
          git diff --exit-code -- addon/bms_zigbee
      - name: Build amd64 add-on (no publish)
        run: |
          VERSION=$(node -p 'const v=require("./versions.json"); `${v.zigbee2mqtt}-bms.${v["bms-addon-revision"]}`')
          BASE=$(python -c 'import yaml; print(yaml.safe_load(open("addon/bms_zigbee/build.yaml"))["build_from"]["amd64"])')
          docker build --build-arg BUILD_FROM="$BASE" --build-arg BUILD_VERSION="$VERSION" -t bms-zigbee:pr addon/bms_zigbee
